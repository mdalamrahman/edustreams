    <!-- Analytics Integration (Consent-Gated Google Analytics 4) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Initialize with denied consent by default (GDPR compliance)
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied'
      });

      // Check stored user consent
      try {
        var rawConsent = localStorage.getItem('sdetube_cookie_consent');
        if (rawConsent) {
          var parsed = JSON.parse(rawConsent);
          if (parsed.analytics) {
            gtag('consent', 'update', {
              'analytics_storage': 'granted'
            });
          }
        }
      } catch (e) {}

      // Optional GA4 Measurement ID injection
      var gaId = 'G-SDETUBEPROD';
      if (gaId) {
        var gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
        document.head.appendChild(gaScript);
        gtag('config', gaId, { send_page_view: false });
      }
    </script>
