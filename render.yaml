services:
  - type: web
    name: edustream-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: edustremas
      - key: PYTHON_VERSION
        value: 3.11.8


